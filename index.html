<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitLog</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
    }

    .app {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      padding: 40px 20px;
    }

    .logo {
      font-size: 38px;
      font-weight: 700;
      letter-spacing: -1.5px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #6e6e73;
      font-size: 16px;
      margin-bottom: 48px;
    }

    h2 {
      font-size: 26px;
      margin: 0 0 8px;
      letter-spacing: -0.5px;
    }

    .description {
      color: #6e6e73;
      margin-bottom: 28px;
    }

    .person {
      width: 100%;
      border: 0;
      background: white;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 3px 18px rgba(0,0,0,0.05);
      transition: transform .15s ease;
    }

    .person:active {
      transform: scale(.98);
    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #f0f0f2;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
    }

    .arrow {
      margin-left: auto;
      color: #86868b;
      font-size: 24px;
    }

    #selected {
      margin-top: 36px;
      padding: 18px;
      background: #e8f0ff;
      color: #0066cc;
      border-radius: 16px;
      display: none;
      font-weight: 600;
    }
  </style>
</head>

<body>

  <main class="app">

    <div class="logo">FitLog</div>
    <div class="subtitle">Trening. Progres. Historia.</div>

    <h2>Kto dziś trenuje?</h2>
    <div class="description">
      Wybierz osobę, aby rozpocząć trening.
    </div>

    <button class="person" onclick="selectPerson('Adam')">
      <div class="avatar">A</div>
      Adam
      <div class="arrow">›</div>
    </button>

    <button class="person" onclick="selectPerson('Szymon')">
      <div class="avatar">S</div>
      Szymon
      <div class="arrow">›</div>
    </button>

    <div id="selected"></div>

  </main>

  <script>
    function selectPerson(name) {
      const box = document.getElementById('selected');
      box.style.display = 'block';
      box.textContent = 'Wybrano: ' + name;
    }
  </script>

</body>
</html>
