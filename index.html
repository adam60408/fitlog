<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitLog</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                   "Segoe UI", sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .app {
      max-width: 480px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 40px 20px 60px;
    }

    .logo {
      font-size: 38px;
      font-weight: 700;
      letter-spacing: -1.5px;
    }

    .subtitle {
      margin: 8px 0 48px;
      color: #6e6e73;
      font-size: 16px;
    }

    h2 {
      margin: 0 0 8px;
      font-size: 26px;
      line-height: 1.15;
      letter-spacing: -0.5px;
    }

    .description {
      margin-bottom: 28px;
      color: #6e6e73;
      line-height: 1.45;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    .card {
      width: 100%;
      min-height: 86px;
      margin-bottom: 14px;
      padding: 16px 18px;

      display: flex;
      align-items: center;
      gap: 15px;

      border: 0;
      border-radius: 20px;
      background: #ffffff;
      color: #1d1d1f;

      text-align: left;
      cursor: pointer;

      box-shadow: 0 3px 18px rgba(0, 0, 0, 0.05);

      transition:
        transform 0.15s ease,
        box-shadow 0.15s ease;
    }

    .card:hover {
      box-shadow: 0 5px 22px rgba(0, 0, 0, 0.08);
    }

    .card:active {
      transform: scale(0.98);
    }

    .avatar {
      width: 50px;
      height: 50px;
      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;
      background: #f0f0f2;

      font-size: 18px;
      font-weight: 600;
    }

    .icon,
    .exercise-icon {
      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #f0f0f2;
      color: #1d1d1f;
    }

    .icon {
      width: 50px;
      height: 50px;
      border-radius: 15px;
    }

    .exercise-icon {
      width: 66px;
      height: 66px;
      border-radius: 18px;
    }

    .icon svg {
      width: 26px;
      height: 26px;
    }

    .exercise-icon svg {
      width: 48px;
      height: 48px;
    }

    svg {
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .arrow {
      margin-left: auto;
      flex-shrink: 0;

      color: #86868b;
      font-size: 26px;
      font-weight: 400;
    }

    .back {
      margin: 0 0 32px;
      padding: 0;

      border: 0;
      background: none;
      color: #0071e3;

      font-size: 16px;
      cursor: pointer;
    }

    .user {
      margin-bottom: 10px;
      color: #0071e3;
      font-size: 15px;
      font-weight: 600;
    }

    .person-name,
    .category-name {
      font-size: 18px;
      font-weight: 600;
    }

    .exercise-card {
      align-items: center;
    }

    .exercise-content {
      flex: 1;
      min-width: 0;
    }

    .exercise-name {
      font-size: 16px;
      font-weight: 650;
      line-height: 1.3;
    }

    .exercise-subtitle {
      margin-top: 4px;
      color: #86868b;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.35;
    }

    .exercise-last {
      margin-top: 8px;
      color: #0071e3;
      font-size: 13px;
      font-weight: 500;
      line-height: 1.3;
    }

    .add-exercise {
      width: 100%;
      margin-top: 8px;
      padding: 18px;

      border: 1.5px dashed #c7c7cc;
      border-radius: 20px;
      background: transparent;
      color: #0071e3;

      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .add-exercise:active {
      background: #eeeeef;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10;

      padding: 20px;
      align-items: flex-end;
      justify-content: center;

      background: rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(6px);
    }

    .modal.active {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      overflow-y: auto;

      padding: 24px;
      margin-bottom: 8px;

      border-radius: 24px;
      background: #ffffff;
    }

    .modal-title {
      margin-bottom: 22px;
      font-size: 22px;
      font-weight: 700;
    }

    .label {
      display: block;
      margin-bottom: 7px;

      color: #6e6e73;
      font-size: 13px;
      font-weight: 600;
    }

    .input,
    .select {
      width: 100%;
      margin-bottom: 18px;
      padding: 15px;

      border: 0;
      outline: none;
      border-radius: 14px;

      background: #f5f5f7;
      color: #1d1d1f;
      font-size: 16px;
    }

    .input:focus,
    .select:focus {
      box-shadow: 0 0 0 2px #0071e3;
    }

    .primary-button {
      width: 100%;
      padding: 15px;

      border: 0;
      border-radius: 14px;
      background: #0071e3;
      color: #ffffff;

      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .cancel-button {
      width: 100%;
      padding: 15px 0 4px;

      border: 0;
      background: none;
      color: #6e6e73;

      font-size: 15px;
      cursor: pointer;
    }

    @media (max-width: 380px) {
      .app {
        padding-left: 15px;
        padding-right: 15px;
      }

      .exercise-icon {
        width: 58px;
        height: 58px;
      }

      .exercise-icon svg {
        width: 42px;
        height: 42px;
      }

      .exercise-name {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <!-- EKRAN WYBORU OSOBY -->

    <section id="personScreen" class="screen active">

      <div class="logo">FitLog</div>
      <div class="subtitle">Trening. Progres. Historia.</div>

      <h2>Kto dziś trenuje?</h2>

      <div class="description">
        Wybierz osobę, aby rozpocząć trening.
      </div>

      <button class="card" onclick="selectPerson('Adam')">
        <div class="avatar">A</div>
        <span class="person-name">Adam</span>
        <div class="arrow">›</div>
      </button>

      <button class="card" onclick="selectPerson('Szymon')">
        <div class="avatar">S</div>
        <span class="person-name">Szymon</span>
        <div class="arrow">›</div>
      </button>

    </section>


    <!-- EKRAN WYBORU KATEGORII -->

    <section id="categoryScreen" class="screen">

      <button class="back" onclick="showPersonScreen()">
        ‹ Zmień osobę
      </button>

      <div class="user" id="activeUser"></div>

      <h2>Wybierz kategorię</h2>

      <div class="description">
        Co dziś ćwiczymy?
      </div>

      <button class="card" onclick="selectCategory('Ławka')">

        <div class="icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 18h16"/>
            <path d="M6 18v-5"/>
            <path d="M18 18v-5"/>
            <path d="M7 13h10"/>
            <path d="M3 9h18"/>
            <path d="M5 7v4"/>
            <path d="M19 7v4"/>
          </svg>
        </div>

        <span class="category-name">Ławka</span>
        <div class="arrow">›</div>

      </button>

      <button class="card" onclick="selectCategory('Linki')">

        <div class="icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="5" cy="6" r="2"/>
            <circle cx="19" cy="6" r="2"/>
            <path d="M5 8v5"/>
            <path d="M19 8v5"/>
            <path d="M5 13l5 5"/>
            <path d="M19 13l-5 5"/>
            <circle cx="12" cy="18" r="2"/>
          </svg>
        </div>

        <span class="category-name">Linki</span>
        <div class="arrow">›</div>

      </button>

      <button class="card" onclick="selectCategory('Maszyny')">

        <div class="icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="3"/>
            <path d="M12 2v3"/>
            <path d="M12 19v3"/>
            <path d="M2 12h3"/>
            <path d="M19 12h3"/>
            <path d="M5 5l2 2"/>
            <path d="M17 17l2 2"/>
            <path d="M19 5l-2 2"/>
            <path d="M7 17l-2 2"/>
          </svg>
        </div>

        <span class="category-name">Maszyny</span>
        <div class="arrow">›</div>

      </button>

      <button class="card" onclick="selectCategory('Inne')">

        <div class="icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 5v14"/>
            <path d="M5 12h14"/>
          </svg>
        </div>

        <span class="category-name">Inne</span>
        <div class="arrow">›</div>

      </button>

    </section>


    <!-- EKRAN WYBORU ĆWICZENIA -->

    <section id="exerciseScreen" class="screen">

      <button class="back" onclick="showCategoryScreen()">
        ‹ Kategorie
      </button>

      <div class="user" id="exerciseUser"></div>

      <h2 id="exerciseHeading">Ławka</h2>

      <div class="description">
        Wybierz ćwiczenie.
      </div>

      <div id="exerciseList"></div>

      <button class="add-exercise" onclick="openAddExercise()">
        + Dodaj własne ćwiczenie
      </button>

    </section>

  </main>


  <!-- OKNO DODAWANIA ĆWICZENIA -->

  <div id="addExerciseModal" class="modal">

    <div class="modal-box">

      <div class="modal-title">
        Nowe ćwiczenie
      </div>

      <label class="label" for="exerciseName">
        Nazwa ćwiczenia
      </label>

      <input
        id="exerciseName"
        class="input"
        type="text"
        placeholder="np. Wyciskanie wąskim chwytem"
      >

      <label class="label" for="exerciseSubtitle">
        Podtytuł (opcjonalnie)
      </label>

      <input
        id="exerciseSubtitle"
        class="input"
        type="text"
        placeholder="np. ławka lekko uniesiona"
      >

      <label class="label" for="exerciseIcon">
        Piktogram
      </label>

      <select id="exerciseIcon" class="select">
        <option value="barbell">Sztanga</option>
        <option value="dumbbells">Hantle leżąc</option>
        <option value="shoulders">Hantle siedząc</option>
        <option value="biceps">Biceps / ramiona</option>
        <option value="cable">Linki</option>
        <option value="machine">Maszyna</option>
        <option value="other">Inne</option>
      </select>

      <button class="primary-button" onclick="addExercise()">
        Dodaj ćwiczenie
      </button>

      <button class="cancel-button" onclick="closeAddExercise()">
        Anuluj
      </button>

    </div>

  </div>


  <script>
    let currentUser = null;
    let currentCategory = null;

    const exercises = {
      "Ławka": [
        {
          name: "Wyciskanie sztangi, ławka prosta",
          subtitle: "",
          icon: "barbell"
        },
        {
          name: "Wyciskanie hantli leżąc",
          subtitle: "",
          icon: "dumbbells"
        },
        {
          name: "Wyciskanie hantli siedząc",
          subtitle: "",
          icon: "shoulders"
        },
        {
          name: "Bicepsy siedząc hantlami",
          subtitle: "",
          icon: "biceps"
        }
      ],

      "Linki": [],
      "Maszyny": [],
      "Inne": []
    };


    function getIcon(type) {

      const icons = {

        barbell: `
          <svg viewBox="0 0 64 64" aria-hidden="true">

            <!-- ławka -->
            <path d="M18 45h29"/>
            <path d="M22 45v8"/>
            <path d="M43 45v8"/>

            <!-- sylwetka leżąca -->
            <circle cx="19" cy="36" r="3"/>
            <path d="M22 37h20"/>
            <path d="M38 37l7 6"/>

            <!-- ręce do sztangi -->
            <path d="M28 36l-2-12"/>
            <path d="M37 36l2-12"/>

            <!-- sztanga -->
            <path d="M14 23h36"/>
            <path d="M18 18v10"/>
            <path d="M46 18v10"/>
            <path d="M12 20v6"/>
            <path d="M52 20v6"/>

          </svg>
        `,

        dumbbells: `
          <svg viewBox="0 0 64 64" aria-hidden="true">

            <!-- ławka -->
            <path d="M18 46h29"/>
            <path d="M22 46v8"/>
            <path d="M43 46v8"/>

            <!-- sylwetka leżąca -->
            <circle cx="18" cy="37" r="3"/>
            <path d="M21 38h22"/>
            <path d="M38 38l7 6"/>

            <!-- ręce -->
            <path d="M28 37l-5-14"/>
            <path d="M36 37l5-14"/>

            <!-- lewy hantel -->
            <path d="M17 22h12"/>
            <path d="M19 18v8"/>
            <path d="M27 18v8"/>

            <!-- prawy hantel -->
            <path d="M35 22h12"/>
            <path d="M37 18v8"/>
            <path d="M45 18v8"/>

          </svg>
        `,

        shoulders: `
          <svg viewBox="0 0 64 64" aria-hidden="true">

            <!-- ławka z oparciem -->
            <path d="M25 33v18"/>
            <path d="M25 48h22"/>
            <path d="M30 48v7"/>
            <path d="M44 48v7"/>

            <!-- osoba -->
            <circle cx="35" cy="21" r="4"/>
            <path d="M35 25v18"/>
            <path d="M35 43l-7 7"/>
            <path d="M35 43l9 6"/>

            <!-- ramiona -->
            <path d="M34 30l-9-7"/>
            <path d="M36 30l9-7"/>

            <!-- hantle -->
            <path d="M19 22h12"/>
            <path d="M21 18v8"/>
            <path d="M29 18v8"/>

            <path d="M39 22h12"/>
            <path d="M41 18v8"/>
            <path d="M49 18v8"/>

          </svg>
        `,

        biceps: `
          <svg viewBox="0 0 64 64" aria-hidden="true">

            <!-- ławka -->
            <path d="M24 48h24"/>
            <path d="M28 48v7"/>
            <path d="M44 48v7"/>
            <path d="M25 32v16"/>

            <!-- osoba -->
            <circle cx="35" cy="19" r="4"/>
            <path d="M35 23v20"/>
            <path d="M35 43l-8 7"/>
            <path d="M35 43l10 6"/>

            <!-- zgięte ręce -->
            <path d="M34 29l-8 6l5 7"/>
            <path d="M36 29l8 6l-5 7"/>

            <!-- hantle przy dłoniach -->
            <path d="M24 42h10"/>
            <path d="M26 38v8"/>
            <path d="M32 38v8"/>

            <path d="M36 42h10"/>
            <path d="M38 38v8"/>
            <path d="M44 38v8"/>

          </svg>
        `,

        cable: `
          <svg viewBox="0 0 64 64" aria-hidden="true">

            <path d="M13 10v44"/>
            <path d="M51 10v44"/>
            <path d="M13 10h38"/>

            <circle cx="19" cy="16" r="3"/>
            <circle cx="45" cy="16" r="3"/>

            <path d="M19 19l10 18"/>
            <path d="M45 19L35 37"/>

            <path d="M27 37h10"/>

            <circle cx="32" cy="28" r="4"/>
            <path d="M32 32v14"/>
            <path d="M32 46l-7 8"/>
            <path d="M32 46l7 8"/>

          </svg>
        `,

        machine: `
          <svg viewBox="0 0 64 64" aria-hidden="true">

            <path d="M15 9v46"/>
            <path d="M49 9v46"/>
            <path d="M15 9h34"/>

            <path d="M20 15h8v22h-8z"/>
            <path d="M36 15h8v22h-8z"/>

            <path d="M24 42h16"/>
            <path d="M28 42v10"/>
            <path d="M36 42v10"/>

            <circle cx="32" cy="28" r="4"/>
            <path d="M32 32v12"/>

          </svg>
        `,

        other: `
          <svg viewBox="0 0 64 64" aria-hidden="true">

            <circle cx="32" cy="32" r="20"/>
            <path d="M32 21v22"/>
            <path d="M21 32h22"/>

          </svg>
        `

      };

      return icons[type] || icons.other;
    }


    function hideAllScreens() {
      document.querySelectorAll(".screen").forEach(screen => {
        screen.classList.remove("active");
      });
    }


    function selectPerson(name) {
      currentUser = name;

      hideAllScreens();

      document
        .getElementById("categoryScreen")
        .classList.add("active");

      document
        .getElementById("activeUser")
        .textContent = name + " · Dzisiejszy trening";
    }


    function showPersonScreen() {
      hideAllScreens();

      document
        .getElementById("personScreen")
        .classList.add("active");
    }


    function showCategoryScreen() {
      hideAllScreens();

      document
        .getElementById("categoryScreen")
        .classList.add("active");
    }


    function selectCategory(category) {
      currentCategory = category;

      hideAllScreens();

      document
        .getElementById("exerciseScreen")
        .classList.add("active");

      document
        .getElementById("exerciseUser")
        .textContent = currentUser + " · Dzisiejszy trening";

      document
        .getElementById("exerciseHeading")
        .textContent = category;

      renderExercises();
    }


    function renderExercises() {
      const list = document.getElementById("exerciseList");

      list.innerHTML = "";

      const categoryExercises = exercises[currentCategory] || [];

      if (categoryExercises.length === 0) {
        list.innerHTML = `
          <div class="description">
            Nie ma jeszcze ćwiczeń w tej kategorii.
          </div>
        `;

        return;
      }

      categoryExercises.forEach((exercise, index) => {
        const button = document.createElement("button");

        button.className = "card exercise-card";

        button.onclick = function () {
          selectExercise(index);
        };

        const subtitleHTML = exercise.subtitle
          ? `
            <div class="exercise-subtitle">
              ${escapeHtml(exercise.subtitle)}
            </div>
          `
          : "";

        button.innerHTML = `
          <div class="exercise-icon">
            ${getIcon(exercise.icon)}
          </div>

          <div class="exercise-content">

            <div class="exercise-name">
              ${escapeHtml(exercise.name)}
            </div>

            ${subtitleHTML}

            <div class="exercise-last">
              Brak poprzedniego treningu
            </div>

          </div>

          <div class="arrow">›</div>
        `;

        list.appendChild(button);
      });
    }


    function selectExercise(index) {
      const exercise = exercises[currentCategory][index];

      alert("Wybrano ćwiczenie: " + exercise.name);
    }


    function openAddExercise() {
      document
        .getElementById("addExerciseModal")
        .classList.add("active");
    }


    function closeAddExercise() {
      document
        .getElementById("addExerciseModal")
        .classList.remove("active");

      document.getElementById("exerciseName").value = "";
      document.getElementById("exerciseSubtitle").value = "";
      document.getElementById("exerciseIcon").value = "barbell";
    }


    function addExercise() {
      const name = document
        .getElementById("exerciseName")
        .value
        .trim();

      const subtitle = document
        .getElementById("exerciseSubtitle")
        .value
        .trim();

      const icon = document
        .getElementById("exerciseIcon")
        .value;

      if (!name) {
        alert("Wpisz nazwę ćwiczenia.");
        return;
      }

      exercises[currentCategory].push({
        name: name,
        subtitle: subtitle,
        icon: icon
      });

      closeAddExercise();
      renderExercises();
    }


    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

  </script>

</body>
</html>
